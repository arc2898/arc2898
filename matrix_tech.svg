<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" style="background-color: #0d1117; border-radius: 12px;">
  <style>
    @keyframes fall1 {
      0% { transform: translateY(-100px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(250px); opacity: 0; }
    }
    @keyframes fall2 {
      0% { transform: translateY(-120px); opacity: 0; }
      25% { opacity: 0.8; }
      75% { opacity: 0.8; }
      100% { transform: translateY(250px); opacity: 0; }
    }
    @keyframes pulse {
      0% { text-shadow: 0 0 5px #00ff66, 0 0 10px #00ff66; }
      50% { text-shadow: 0 0 20px #00ff66, 0 0 30px #00ff66; }
      100% { text-shadow: 0 0 5px #00ff66, 0 0 10px #00ff66; }
    }
    .matrix-col {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      fill: #00ff66;
    }
    .tech-box {
      fill: rgba(13, 17, 23, 0.85);
      stroke: #00ff66;
      stroke-width: 2;
      rx: 8;
    }
    .tech-text {
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      font-weight: bold;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: middle;
      animation: pulse 3s infinite;
    }
  </style>

  <!-- Matrix Rain Columns Background -->
  <g opacity="0.4">
    <text class="matrix-col" x="50" y="0" style="animation: fall1 2.5s linear infinite;">01HTML501</text>
    <text class="matrix-col" x="150" y="-30" style="animation: fall2 3.1s linear infinite;">10CSS310</text>
    <text class="matrix-col" x="250" y="-10" style="animation: fall1 2.2s linear infinite;">JS_TS_LINUX</text>
    <text class="matrix-col" x="350" y="-50" style="animation: fall2 2.8s linear infinite;">BASH_GIT01</text>
    <text class="matrix-col" x="450" y="-20" style="animation: fall1 3.5s linear infinite;">10NODEJS10</text>
    <text class="matrix-col" x="550" y="-40" style="animation: fall2 2.1s linear infinite;">ANDROID_01</text>
    <text class="matrix-col" x="650" y="-10" style="animation: fall1 2.9s linear infinite;">FEPTERA_OS</text>
    <text class="matrix-col" x="730" y="-35" style="animation: fall2 2.4s linear infinite;">01ARC289810</text>
  </g>

  <!-- Foreground Tech Boxes (Matrix Rain Matrix) -->
  <!-- Row 1 -->
  <g transform="translate(40, 40)">
    <rect class="tech-box" x="0" y="0" width="120" height="40"/>
    <text class="tech-text" x="60" y="20">HTML5</text>
  </g>
  <g transform="translate(180, 40)">
    <rect class="tech-box" x="0" y="0" width="120" height="40"/>
    <text class="tech-text" x="60" y="20">CSS3</text>
  </g>
  <g transform="translate(320, 40)">
    <rect class="tech-box" x="0" y="0" width="120" height="40"/>
    <text class="tech-text" x="60" y="20">JavaScript</text>
  </g>
  <g transform="translate(460, 40)">
    <rect class="tech-box" x="0" y="0" width="120" height="40"/>
    <text class="tech-text" x="60" y="20">TypeScript</text>
  </g>
  <g transform="translate(600, 40)">
    <rect class="tech-box" x="0" y="0" width="150" height="40"/>
    <text class="tech-text" x="75" y="20">Node.js</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40, 110)">
    <rect class="tech-box" x="0" y="0" width="120" height="40"/>
    <text class="tech-text" x="60" y="20">Linux</text>
  </g>
  <g transform="translate(180, 110)">
    <rect class="tech-box" x="0" y="0" width="120" height="40"/>
    <text class="tech-text" x="60" y="20">Bash</text>
  </g>
  <g transform="translate(320, 110)">
    <rect class="tech-box" x="0" y="0" width="120" height="40"/>
    <text class="tech-text" x="60" y="20">Android</text>
  </g>
  <g transform="translate(460, 110)">
    <rect class="tech-box" x="0" y="0" width="120" height="40"/>
    <text class="tech-text" x="60" y="20">Git / GitHub</text>
  </g>
  <g transform="translate(600, 110)">
    <rect class="tech-box" x="0" y="0" width="150" height="40"/>
    <text class="tech-text" x="75" y="20">FepTera</text>
  </g>
</svg>
